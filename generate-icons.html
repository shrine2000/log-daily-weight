<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .icon-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Click "Generate All Icons" to create all required icon sizes. Then right-click each icon and save it to the assets folder.</p>
    
    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAllIcons()">Download All Icons (Zip)</button>
    
    <div id="icon-preview" class="icon-preview"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#007AFF');
            gradient.addColorStop(1, '#0056b3');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.2;
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw scale/weight icon
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.03;
            
            // Scale base
            const centerX = size / 2;
            const centerY = size / 2;
            const scaleWidth = size * 0.4;
            const scaleHeight = size * 0.15;
            
            // Draw scale platform
            ctx.fillRect(centerX - scaleWidth / 2, centerY - scaleHeight / 2, scaleWidth, scaleHeight);
            
            // Draw scale stand
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - scaleHeight / 2);
            ctx.lineTo(centerX, centerY + scaleHeight);
            ctx.stroke();
            
            // Draw numbers/weight indicator
            ctx.font = `bold ${size * 0.12}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('kg', centerX, centerY - scaleHeight * 1.5);
            
            return canvas;
        }
        
        function generateAllIcons() {
            const preview = document.getElementById('icon-preview');
            preview.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = generateIcon(size);
                const div = document.createElement('div');
                div.className = 'icon-item';
                
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                img.style.width = '100px';
                img.style.height = '100px';
                img.style.imageRendering = 'pixelated';
                
                const label = document.createElement('p');
                label.textContent = `${size}x${size}`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, size);
                
                div.appendChild(img);
                div.appendChild(label);
                div.appendChild(downloadBtn);
                preview.appendChild(div);
            });
        }
        
        function downloadIcon(canvas, size) {
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        async function downloadAllIcons() {
            for (const size of sizes) {
                const canvas = generateIcon(size);
                await new Promise(resolve => setTimeout(resolve, 100));
                downloadIcon(canvas, size);
            }
            alert('All icons downloaded! Move them to the assets folder.');
        }
        
        // Auto-generate on load
        window.addEventListener('load', generateAllIcons);
    </script>
</body>
</html>
